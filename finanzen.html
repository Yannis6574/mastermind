<!DOCTYPE html>
<html lang="de">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="header">MasterMind</title>
    <link rel="stylesheet" href="finanzen.css">
    </head>
    <body>
        <img id="menu-icon" src="Images/menu.png"></div>
        <div id="side-bar">
            <a href="training-newsession.html" class="menu-category">Training</a>
            <a class="menu-category">Ernährung</a>
            <a class="menu-category" link="">To Do's</a>
            <a class="menu-category" link="">Rezepte</a>
            <a class="menu-category" link="">Finanzen</a>
        </div>

        <div class="content">
            <h1>MasterMind</h1>
            <div id="finance-container">
                <input id="finance-input" class="finance-input-objects" placeholder="in €" type="number" step="0.01" min="0">
                <select name="financial-type" id="financial-type" class="finance-input-objects">
                    <option value="food-at-work">Essen (Arbeit)</option>
                    <option value="food-privat">Essen (privat)</option>
                    <option value="food-fun">Süßigkeiten/Softdrinks</option>
                    <option value="fuel">Tanken</option>
                    <option value="drinks">Kaltgetränke</option>
                    <option value="smoking">Zigaretten</option>
                    <option value="bush">Hecke</option>
                    <option value="coffee">Kaffee</option>
                    <option value="ksc">KSC</option>
                    <option value="gambling">Glücksspiel</option>
                    <option value="clothing">Kleidung</option>
                </select>
                <button id="save-btn">Speichern</button>
            </div>
            <div id="finance-overview">
                <p>Daten</p>
                <div id="full-price">
                    <p>Gesamtausgaben:</p>
                    <p id="full-price-value"></p>
                </div>
                <div id="highest-section">
                    <p>Höchste Ausgabenart:</p>
                    <p id="highest-section-value"></p>
                </div>
            </div>
            <div id="finance-dashboard">
                <p>Auswertung</p>
                <div id="columns"></div>
            </div>
        </div>
        <script src="finanzen.js"></script>
    </body>
</html>
