<!DOCTYPE html>
<html lang="de">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Training</title>
    <link rel="stylesheet" href="training.css">
    </head>
    <body>
        <img id="menu-icon" src="Images/menu.png"></div>
        <div id="side-bar">
            <a href="training-newsession.html" class="menu-category">Training</a>
            <a class="menu-category">Ernährung</a>
            <a class="menu-category" link="">To Do's</a>
            <a href="rezepte.html" class="menu-category" link="">Rezepte</a>
            <a class="menu-category" link="">Finanzen</a>
        </div>

        <div class="container">
            <h1 id="header">MasterMind</h1>
            <div id="content">
                <div id="nav-bar">
                    <a href="training-newsession.html" class="menu-category">Einheit hinzufügen</a>
                    <a href="training-overview.html" class="menu-category">Übersicht</a>
                    <a href="training-calender.html" class="menu-category">Kalender</a>
                </div>
                <div id="newSession">
                    <div id="type-dropdown" class="dropdown">
                        <button id="type-value" class="dropdown-button">Trainingsart wählen...</button>
                        <img src="chevron-icon-size_64.png">

                        <div id="type-content" class="dropdown-content">
                            <a onclick="setValue('Push-Day', 'type-value', 'type-content')">Push-Day</a>
                            <a onclick="setValue('Pull-Day', 'type-value', 'type-content')">Pull-Day</a>
                            <a onclick="setValue('Leg-Day', 'type-value', 'type-content')">Leg-Day</a>
                            <a>Andere Trainingsart</a>
                        </div>
                    </div>
                    <div id="exercise-div">
                        <input id="name-e1" type="text" placeholder="Name der Übung">
                        <div id="machine-dropdown" class="dropdown">
                            <button id="machine-value" class="dropdown-button">Trainingsgerät wählen...</button>
                            <img src="chevron-icon-size_64.png">
                            <div id="machine-div" class="dropdown-content">
                                <a onclick="setValue('Kurzhantel', 'machine-value', 'machine-div')">Kurzhantel</a>
                                <a onclick="setValue('Langhantel', 'machine-value', 'machine-div')">Langhantel</a>
                                <a onclick="setValue('Dip-Barren', 'machine-value', 'machine-div')">Dip-Barren</a>
                                <a onclick="setValue('Kurzhantel', 'machine-value', 'machine-div')">Klimmzugstange</a>
                                <a onclick="setValue('Langhantel', 'machine-value', 'machine-div')">Hantelbank</a>
                                <a onclick="setValue('Dip-Barren', 'machine-value', 'machine-div')">Dip-Barren</a>
                                <a>Andere Trainingsart</a>
                            </div>
                        </div>
                        
                    </div>
                    <div id="add-button">
                        <img src="plus.png" alt="plus">
                    </div>
                    <div id="amount-dropdown" class="dropdown" show>
                        <button id="amount-value" class="dropdown-button">Anzahl der Sätze</button>
                        <img src="chevron-icon-size_64.png">

                        <div id="amount-content" class="dropdown-content">
                            <a onclick="setValue('2', 'amount-value', 'amount-content')">2</a>
                            <a onclick="setValue('3', 'amount-value', 'amount-content')">3</a>
                            <a onclick="setValue('4', 'amount-value', 'amount-content')">4</a>
                            <a onclick="setValue('5', 'amount-value', 'amount-content')">5</a>
                            <a onclick="setValue('6', 'amount-value', 'amount-content')">6</a>
                            <a>Andere Satzanzahl</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <script src="training.js"></script>
    </body>
</html>
